<svg viewBox="0 0 800 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="decorative sunflower divider">
  <defs>
    <linearGradient id="lineLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC93C" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFC93C" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="lineRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC93C" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FFC93C" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="0" y="15" width="360" height="2" fill="url(#lineLeft)" />
  <rect x="440" y="15" width="360" height="2" fill="url(#lineRight)" />

  <g transform="translate(400,16)">
    <circle r="4.5" fill="#7A4A21" />
    <g fill="#FFD23F">
      <ellipse rx="7" ry="3" transform="rotate(0)   translate(9,0)" />
      <ellipse rx="7" ry="3" transform="rotate(45)  translate(9,0)" />
      <ellipse rx="7" ry="3" transform="rotate(90)  translate(9,0)" />
      <ellipse rx="7" ry="3" transform="rotate(135) translate(9,0)" />
      <ellipse rx="7" ry="3" transform="rotate(180) translate(9,0)" />
      <ellipse rx="7" ry="3" transform="rotate(225) translate(9,0)" />
      <ellipse rx="7" ry="3" transform="rotate(270) translate(9,0)" />
      <ellipse rx="7" ry="3" transform="rotate(315) translate(9,0)" />
    </g>
    <circle r="3" fill="#7A4A21" />
  </g>
</svg>
