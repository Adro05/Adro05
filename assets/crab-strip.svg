<svg viewBox="0 0 1200 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="a small cartoon crab wearing glasses scuttling along the ground">
  <defs>
    <radialGradient id="crabGroundGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6E9950" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6E9950" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- transparent background, just a faint ground line + tufts -->
  <ellipse cx="600" cy="66" rx="560" ry="16" fill="url(#crabGroundGlow)" />
  <line x1="10" y1="70" x2="1190" y2="70" stroke="#89B35C" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="1 7" stroke-linecap="round" />

  <g>
    <path d="M 60 70 q 4 -8 8 0" stroke="#89B35C" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6" />
    <path d="M 250 70 q 4 -8 8 0" stroke="#89B35C" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6" />
    <path d="M 480 70 q 4 -8 8 0" stroke="#89B35C" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6" />
    <path d="M 720 70 q 4 -8 8 0" stroke="#89B35C" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6" />
    <path d="M 950 70 q 4 -8 8 0" stroke="#89B35C" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6" />
    <path d="M 1130 70 q 4 -8 8 0" stroke="#89B35C" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6" />
  </g>

  <g transform="translate(50,58)">
    <animateTransform attributeName="transform" type="translate"
      values="50,58; 1130,58; 50,58"
      keyTimes="0;0.5;1"
      keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"
      calcMode="spline"
      dur="15s" repeatCount="indefinite" />

    <!-- tiny bob while scuttling -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,-2; 0,0; 0,-2; 0,0"
        dur="0.6s" repeatCount="indefinite" additive="sum" />

      <!-- facing flip: right for first half of the journey, left for the second -->
      <g transform="scale(1,1)">
        <animateTransform attributeName="transform" type="scale"
          calcMode="discrete"
          keyTimes="0;0.5;1"
          values="1,1;-1,1;1,1"
          dur="15s" repeatCount="indefinite" />

        <!-- legs -->
        <path d="M -14 5 L -24 12 M -14 5 L -24 -2" stroke="#3A2418" stroke-width="2.2" stroke-linecap="round" />
        <path d="M -6 9 L -13 18" stroke="#3A2418" stroke-width="2.2" stroke-linecap="round" />
        <path d="M 6 9 L 13 18" stroke="#3A2418" stroke-width="2.2" stroke-linecap="round" />
        <path d="M 14 5 L 24 12 M 14 5 L 24 -2" stroke="#3A2418" stroke-width="2.2" stroke-linecap="round" />

        <!-- claws -->
        <ellipse cx="-21" cy="-9" rx="7" ry="4.5" fill="#FF6B3D" stroke="#3A2418" stroke-width="1.2" transform="rotate(-25 -21 -9)" />
        <ellipse cx="21" cy="-9" rx="7" ry="4.5" fill="#FF6B3D" stroke="#3A2418" stroke-width="1.2" transform="rotate(25 21 -9)" />

        <!-- body -->
        <ellipse cx="0" cy="2" rx="19" ry="11" fill="#FF6B3D" stroke="#3A2418" stroke-width="1.4" />
        <ellipse cx="0" cy="-1" rx="19" ry="8.5" fill="#FFA05C" opacity="0.55" />

        <!-- eye stalks -->
        <path d="M -7 -9 L -8 -18" stroke="#FF6B3D" stroke-width="2.6" stroke-linecap="round" />
        <path d="M 7 -9 L 8 -18" stroke="#FF6B3D" stroke-width="2.6" stroke-linecap="round" />

        <!-- glasses -->
        <circle cx="-8" cy="-19" r="4.6" fill="#FFF3D6" stroke="#2A1B10" stroke-width="1.5" />
        <circle cx="8" cy="-19" r="4.6" fill="#FFF3D6" stroke="#2A1B10" stroke-width="1.5" />
        <path d="M -3.2 -19 L 3.2 -19" stroke="#2A1B10" stroke-width="1.5" />
        <path d="M -12.4 -20 L -14.5 -21" stroke="#2A1B10" stroke-width="1.3" stroke-linecap="round" />
        <path d="M 12.4 -20 L 14.5 -21" stroke="#2A1B10" stroke-width="1.3" stroke-linecap="round" />
        <circle cx="-8" cy="-19" r="1.6" fill="#1A0F08" />
        <circle cx="8" cy="-19" r="1.6" fill="#1A0F08" />
      </g>
    </g>
  </g>
</svg>
